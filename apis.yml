aid: aletiq
name: Aletiq
description: Aletiq is a French software company building a next-generation, AI-powered Product Lifecycle
  Management (PLM) and Product Data Management (PDM) platform for regulated manufacturers. The platform
  centralizes technical data (CAD files, drawings, bills of materials, configurations, and work
  instructions), enforces traceability and regulatory compliance, and automates business processes such
  as approvals, engineering change management, and project milestones. Aletiq emphasizes rapid deployment
  and high adoption across operational teams, and integrates with major CAD tools (SolidWorks, CATIA,
  Autodesk Inventor, Siemens NX, Creo) and ERP systems (SAP, Sage, Cegid, Infor, Odoo) via connectors and
  a custom-integration API. It serves aerospace and defense, medical devices, energy, electronics,
  automotive, and luxury-goods industries. Aletiq is backed by Point Nine and added to the API Evangelist
  network as a portfolio-lead profile.
